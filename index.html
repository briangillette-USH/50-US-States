<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>U.S. State Location Quiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.95);
      --panel: rgba(17, 24, 39, 0.97);
      --text: #e2e8f0;
      --accent: #38bdf8;
      --correct: #16a34a;
      --hint: #f59e0b;
      --wrong: #ef4444;
      --state-fill: #c7d2fe;
      --state-border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app-shell {
      width: min(1200px, 100%);
      display: grid;
      gap: 18px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(16px);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      letter-spacing: -0.04em;
    }

    .prompt-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .prompt {
      margin-top: 12px;
      font-size: 1.05rem;
      line-height: 1.55;
      color: #cbd5e1;
      min-width: 260px;
    }

    #hint-button {
      margin-top: 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(56, 189, 248, 0.12);
      color: #e2e8f0;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    #hint-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.32);
    }

    #hint-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(96px, 1fr));
      gap: 12px;
    }

    .stat-card {
      padding: 16px;
      background: rgba(148, 163, 184, 0.08);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      text-align: center;
    }

    .stat-card strong {
      display: block;
      font-size: 1.35rem;
      color: var(--text);
    }

    .stat-card span {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .map-wrapper {
      position: relative;
      background: linear-gradient(180deg, rgba(15,23,42,0.78), rgba(15,23,42,0.92));
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 28px;
      padding: 18px;
      overflow: hidden;
      aspect-ratio: 1000 / 589;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 18px;
    }

    .state {
      fill: var(--state-fill);
      stroke: var(--state-border);
      stroke-width: 1.2;
      cursor: pointer;
      transition: fill 180ms ease, transform 160ms ease;
      vector-effect: non-scaling-stroke;
    }

    .state:hover {
      fill: #82aaff;
      transform: translateY(-1px);
    }

    .state.completed {
      fill: var(--correct);
      cursor: default;
      opacity: 0.95;
    }

    .state.hint {
      fill: var(--hint) !important;
      opacity: 0.95;
    }

    .state:focus-visible {
      outline: 3px solid rgba(56, 189, 248, 0.75);
      outline-offset: 2px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      z-index: 10;
      padding: 24px;
      text-align: center;
      color: var(--text);
    }

    .overlay.active,
    .overlay.visible {
      display: flex;
    }

    .overlay-card {
      width: min(90%, 520px);
      padding: 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.4);
    }

    .overlay-card h2 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .overlay-card p {
      margin: 0 0 24px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .overlay-card button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 1rem;
      background: linear-gradient(135deg, #38bdf8, #60a5fa);
      color: #0f172a;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .overlay-card button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 28px rgba(56, 189, 248, 0.24);
    }

    @media (max-width: 840px) {
      header {
        grid-template-columns: 1fr;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(100px, 1fr));
      }

      .map-wrapper {
        aspect-ratio: 4 / 3;
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 14px;
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .map-wrapper {
        aspect-ratio: 1.3 / 1;
      }
    }
  </style>
</head>

       <div id="loading-screen" class="overlay active">
         <div class="overlay-card">
           <h2>Starting the quiz...</h2>
           <p>Verified map data and state pool integrity. Preparing your first question now.</p>
         </div>
       </div>

       <div id="summary-screen" class="overlay">
         <div class="overlay-card">
           <h2>Quiz Complete</h2>
           <p id="summary-text">You answered all states!</p>
           <button id="restart-button" type="button">Play Again</button>
         </div>
       </div>
     </div>
   </div>

   <script>
     const promptEl = document.getElementById('prompt');
     const correctCountEl = document.getElementById('correct-count');
     const incorrectCountEl = document.getElementById('incorrect-count');
     const remainingCountEl = document.getElementById('remaining-count');
     const loadingScreen = document.getElementById('loading-screen');
     const summaryScreen = document.getElementById('summary-screen');
     const summaryText = document.getElementById('summary-text');
     const restartButton = document.getElementById('restart-button');
     const hintButton = document.getElementById('hint-button');
     const stateElements = Array.from(document.querySelectorAll('.state'));

     let remainingStates = [];
     let correctAnswers = 0;
     let incorrectAnswers = 0;
     let currentTargetId = null;
     let hintTimeout = null;
     let questionTimeout = null;
     let activeHintIds = [];

     const stateNameById = stateElements.reduce((map, state) => {
       map[state.id] = state.dataset.name || state.id;
       return map;
     }, {});

     function getActiveStateIds() {
       return stateElements
         .filter(state => document.body.contains(state) && !state.classList.contains('completed'))
         .map(state => state.id);
     }

     function syncStatePool() {
       const activeIds = getActiveStateIds();
       if (remainingStates.length !== activeIds.length || remainingStates.some(id => !activeIds.includes(id))) {
         remainingStates = activeIds.slice();
       }
     }

     function updateStats() {
       correctCountEl.textContent = correctAnswers;
       incorrectCountEl.textContent = incorrectAnswers;
       remainingCountEl.textContent = remainingStates.length;
     }

     function setPromptText(message) {
       promptEl.textContent = message;
     }

     function chooseRandomTarget() {
       syncStatePool();
       if (!remainingStates.length) {
         return null;
       }
       const index = Math.floor(Math.random() * remainingStates.length);
       return remainingStates[index];
     }

     function clearHintHighlights() {
       activeHintIds.forEach(id => {
         const state = document.getElementById(id);
         if (state) {
           state.classList.remove('hint');
         }
       });
       activeHintIds = [];
       if (hintTimeout) {
         clearTimeout(hintTimeout);
         hintTimeout = null;
       }
     }

     function getHintOptions() {
       const targetState = document.getElementById(currentTargetId);
       if (!targetState) {
         return [currentTargetId];
       }

       const targetBox = targetState.getBBox();
       const targetX = targetBox.x + targetBox.width / 2;
       const targetY = targetBox.y + targetBox.height / 2;

       const nearby = remainingStates
         .filter(id => id !== currentTargetId)
         .map(id => {
           const state = document.getElementById(id);
           if (!state) {
             return null;
           }
           const box = state.getBBox();
           const x = box.x + box.width / 2;
           const y = box.y + box.height / 2;
           const distance = (x - targetX) ** 2 + (y - targetY) ** 2;
           return { id, distance };
         })
         .filter(Boolean)
         .sort((a, b) => a.distance - b.distance)
         .map(item => item.id);

       const selected = [currentTargetId];
       selected.push(...nearby.slice(0, 2));
       if (selected.length < 3) {
         const fallback = remainingStates.filter(id => !selected.includes(id));
         while (selected.length < 3 && fallback.length) {
           selected.push(fallback.shift());
         }
       }
       return selected.sort();
     }

     function showHint() {
       if (!currentTargetId) {
         return;
       }
       clearHintHighlights();
       const hintIds = getHintOptions();
       activeHintIds = hintIds;
       hintIds.forEach(id => {
         const state = document.getElementById(id);
         if (state) {
           state.classList.add('hint');
         }
       });
       setPromptText(`Click ${stateNameById[currentTargetId]}. Hint: three possible states are highlighted.`);
       hintButton.disabled = true;
     }

     function startNextQuestion() {
       clearTimeout(questionTimeout);
       clearHintHighlights();
       hintButton.disabled = false;
       const nextTarget = chooseRandomTarget();
       if (!nextTarget) {
         return finishQuiz();
       }
       currentTargetId = nextTarget;
       setPromptText(`Click ${stateNameById[currentTargetId]}.`);
     }

     function finishQuiz() {
       setPromptText('You found every state! Great job.');
       summaryText.textContent = `Final score: ${correctAnswers} correct and ${incorrectAnswers} incorrect.`;
       summaryScreen.classList.add('visible');
     }

     function handleStateClick(event) {
       const clickedId = event.currentTarget.id;
       if (!currentTargetId || event.currentTarget.classList.contains('completed')) {
         return;
       }

       if (clickedId === currentTargetId) {
         event.currentTarget.classList.add('completed');
         event.currentTarget.style.pointerEvents = 'none';
         correctAnswers += 1;
         remainingStates = remainingStates.filter(id => id !== clickedId);
         updateStats();
         startNextQuestion();
         return;
       }

       incorrectAnswers += 1;
       updateStats();
       const actualTarget = document.getElementById(currentTargetId);
       if (actualTarget) {
         actualTarget.classList.add('hint');
         hintTimeout = setTimeout(() => {
           actualTarget.classList.remove('hint');
         }, 900);
       }

       questionTimeout = setTimeout(() => {
         startNextQuestion();
       }, 1100);
     }

     function resetStates() {
       stateElements.forEach(state => {
         state.classList.remove('completed', 'hint');
         state.style.pointerEvents = 'auto';
       });
       clearHintHighlights();
     }

     function initializeQuiz() {
       resetStates();
       remainingStates = getActiveStateIds();
       correctAnswers = 0;
       incorrectAnswers = 0;
       currentTargetId = null;
       hintButton.disabled = true;
       updateStats();
       summaryScreen.classList.remove('visible');
       setPromptText('Preparing your first question...');

       requestAnimationFrame(() => {
         syncStatePool();
         if (!remainingStates.length) {
           setPromptText('No active states found in the map. Reload the page to try again.');
           return;
         }
         loadingScreen.classList.remove('active');
         startNextQuestion();
       });
     }

     function attachStateListeners() {
       stateElements.forEach(state => {
         state.addEventListener('click', handleStateClick);
         state.addEventListener('keydown', event => {
           if (event.key === 'Enter' || event.key === ' ') {
             event.preventDefault();
             handleStateClick(event);
           }
         });
         state.tabIndex = 0;
       });
     }

     restartButton.addEventListener('click', () => {
       initializeQuiz();
     });

     hintButton.addEventListener('click', showHint);

     if (document.readyState === 'loading') {
       document.addEventListener('DOMContentLoaded', () => {
         attachStateListeners();
         initializeQuiz();
       });
     } else {
       attachStateListeners();
       initializeQuiz();
     }
   </script>
